name: Build Ionic Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Provide Firebase configuration for the production build
      # ----------------------------------------------------------
      - name: Create Firebase environment file
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          test -n "$FIREBASE_ENV" || (echo "Missing FIREBASE_ENV GitHub secret" && exit 1)
          printf '%s\n' "$FIREBASE_ENV" > .env
          grep -q '^VITE_FIREBASE_API_KEY=' .env || (echo "FIREBASE_ENV must contain the complete .env content" && exit 1)


      # ----------------------------------------------------------
      # 5. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 6. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 7. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 8. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 9. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 10. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 11. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 12. Rename the generated APK
      # ----------------------------------------------------------
      - name: UniTap.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk UniTap.apk


      # ----------------------------------------------------------
      # 13. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniTap-APK
          path: UniTap.apk
          if-no-files-found: error
          retention-days: 30